name: Render BPL Intro

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Render HTML animation
        run: node render.js

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert video to MP4
        run: |
          mkdir -p final
          ffmpeg -y \
            -i video-output/*.webm \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            final/BPL-Intro.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: BPL-Intro-MP4
          path: final/BPL-Intro.mp4
